name: Brevo marketing

on:
  pull_request:
    paths:
      - '.github/workflows/brevo-marketing.yml'
      - 'wordpress/wp-content/plugins/bactive-brevo-marketing/**'
      - 'scripts/brevo-newsletter-page.php'
      - 'wordpress/wp-content/themes/blocksy-child/template-parts/footer-sage.php'
      - 'wp-content/themes/blocksy-child/template-parts/footer-sage.php'
      - 'docs/operations/brevo-**'
      - 'docs/releases/brevo-marketing.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/brevo-marketing.yml'
      - 'wordpress/wp-content/plugins/bactive-brevo-marketing/**'
      - 'scripts/brevo-newsletter-page.php'
      - 'wordpress/wp-content/themes/blocksy-child/template-parts/footer-sage.php'
      - 'wp-content/themes/blocksy-child/template-parts/footer-sage.php'
      - 'docs/operations/brevo-**'
      - 'docs/releases/brevo-marketing.md'

permissions:
  contents: read

jobs:
  contracts:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax and isolated contract tests
        run: |
          find wordpress/wp-content/plugins/bactive-brevo-marketing -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l scripts/brevo-newsletter-page.php
          php -l wordpress/wp-content/themes/blocksy-child/template-parts/footer-sage.php
          php -l wp-content/themes/blocksy-child/template-parts/footer-sage.php
          for test in wordpress/wp-content/plugins/bactive-brevo-marketing/tests/*-test.php wordpress/wp-content/plugins/bactive-brevo-marketing/tests/*-unit.php; do php "$test"; done
      - name: Signup JavaScript syntax
        run: |
          node --check wordpress/wp-content/plugins/bactive-brevo-marketing/assets/newsletter.js
          node wordpress/wp-content/plugins/bactive-brevo-marketing/tests/newsletter-test.js

  datastore:
    name: Real WooCommerce datastores
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull pinned disposable runtimes
        run: |
          docker pull mariadb:11.4@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
          docker pull wordpress:cli-php8.2@sha256:837d55d02196b5f4c92d236317c6d089ab1471348b31d1708888d444a0390979
      - name: Test consent, scheduler and first-order claims with HPOS and CPT
        run: python3 wordpress/wp-content/plugins/bactive-brevo-marketing/tests/run-datastore-integration.py
