name: PayMongo plugin

on:
  pull_request:
    paths:
      - '.github/workflows/paymongo-plugin.yml'
      - 'wordpress/wp-content/plugins/bactive-paymongo-hosted-checkout/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/paymongo-plugin.yml'
      - 'wordpress/wp-content/plugins/bactive-paymongo-hosted-checkout/**'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl
          coverage: none

      - name: Check OpenSSL
        run: |
          php -r 'exit(extension_loaded("openssl") ? 0 : 1);'

      - name: Lint plugin
        run: find wordpress/wp-content/plugins/bactive-paymongo-hosted-checkout -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run contract tests
        run: php wordpress/wp-content/plugins/bactive-paymongo-hosted-checkout/tests/run.php

  datastore-integration:
    name: Real WooCommerce datastores
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull pinned disposable database
        run: docker pull mariadb:11.4@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430

      - name: Pull pinned WordPress CLI runtime
        run: docker pull wordpress:cli-php8.2@sha256:837d55d02196b5f4c92d236317c6d089ab1471348b31d1708888d444a0390979

      - name: Test first settings save and recovery discovery in HPOS and CPT
        run: python3 wordpress/wp-content/plugins/bactive-paymongo-hosted-checkout/tests/run-datastore-integration.py
