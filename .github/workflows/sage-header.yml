name: Sage header
on:
  pull_request:
    paths:
      - '.github/workflows/sage-header.yml'
      - '**/bactiveph-sage-header.php'
      - '**/header-sage.*'
      - '**/header-sage-mark.png'
      - '**/footer-sage.php'
      - 'tests/sage-header-contract.php'
      - 'tests/sage-header.test.cjs'
      - 'tests/catalogue-runtime/**'
      - 'tests/footer-navigation-contract.php'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sage-header.yml'
      - '**/bactiveph-sage-header.php'
      - '**/header-sage.*'
      - '**/header-sage-mark.png'
      - '**/footer-sage.php'
      - 'tests/sage-header-contract.php'
      - 'tests/sage-header.test.cjs'
      - 'tests/catalogue-runtime/**'
      - 'tests/footer-navigation-contract.php'
permissions:
  contents: read
jobs:
  header-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Header behavior
        env:
          NODE_PATH: ${{ github.workspace }}/tests/catalogue-runtime/node_modules
        run: |
          npm ci --ignore-scripts --prefix tests/catalogue-runtime
          node --test tests/sage-header.test.cjs
      - name: Navigation syntax and contracts
        run: |
          php -l wordpress/wp-content/mu-plugins/bactiveph-sage-header.php
          php -l wordpress/wp-content/themes/blocksy-child/template-parts/header-sage.php
          php -l wordpress/wp-content/themes/blocksy-child/template-parts/footer-sage.php
          php tests/sage-header-contract.php
          php tests/footer-navigation-contract.php
          node --check wordpress/wp-content/themes/blocksy-child/assets/js/header-sage.js
      - name: Source mirrors
        run: |
          cmp wordpress/wp-content/themes/blocksy-child/template-parts/header-sage.php wp-content/themes/blocksy-child/template-parts/header-sage.php
          cmp wordpress/wp-content/themes/blocksy-child/assets/css/header-sage.css wp-content/themes/blocksy-child/assets/css/header-sage.css
          cmp wordpress/wp-content/themes/blocksy-child/assets/js/header-sage.js wp-content/themes/blocksy-child/assets/js/header-sage.js
          cmp wordpress/wp-content/themes/blocksy-child/template-parts/footer-sage.php wp-content/themes/blocksy-child/template-parts/footer-sage.php
          cmp wordpress/wp-content/themes/blocksy-child/assets/images/header-sage-mark.png wp-content/themes/blocksy-child/assets/images/header-sage-mark.png
