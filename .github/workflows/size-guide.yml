name: Size guide
on:
  pull_request:
    paths:
      - '.github/workflows/size-guide.yml'
      - '**/blocksy-child/functions.php'
      - '**/blocksy-child/assets/js/size-guide.js'
      - '**/blocksy-child/assets/css/size-guide.css'
      - 'tests/size-guide.test.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/size-guide.yml'
      - '**/blocksy-child/functions.php'
      - '**/blocksy-child/assets/js/size-guide.js'
      - '**/blocksy-child/assets/css/size-guide.css'
      - 'tests/size-guide.test.cjs'
permissions:
  contents: read
jobs:
  product-dialog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax, behavior and source mirrors
        run: |
          php -l wordpress/wp-content/themes/blocksy-child/functions.php
          php -l wp-content/themes/blocksy-child/functions.php
          node --check wordpress/wp-content/themes/blocksy-child/assets/js/size-guide.js
          node --test tests/size-guide.test.cjs
          cmp wordpress/wp-content/themes/blocksy-child/functions.php wp-content/themes/blocksy-child/functions.php
